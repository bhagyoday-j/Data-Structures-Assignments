<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compression Tool - Divide & Conquer</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background:white;
            padding:20px;
            border-radius:10px;
            width:800px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            margin-bottom:15px;
        }

        input, button{
            margin:10px;
            padding:10px;
        }

        canvas{
            border:1px solid #ccc;
            margin-top:15px;
            max-width:100%;
        }

        .info{
            margin-top:10px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Image Compression Tool</h1>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <label>Compression Quality:</label>
    <input type="range" id="quality" min="0.1" max="1" step="0.1" value="0.6">
    <span id="qualityValue">0.6</span>

    <br>

    <button id="compressBtn">Compress Image</button>

    <div class="info" id="sizeInfo"></div>

    <canvas id="canvas"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
