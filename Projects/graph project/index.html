<!doctype html>
<html>
  <head>
    <title>Graph Navigation</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <h2>City Graph Navigation</h2>

    <div class="controls">
      <input id="start" placeholder="Start City (pune)" />
      <input id="end" placeholder="End City (delhi)" />

      <button onclick="findRoute()">Find Path</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
